<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <radialGradient id="bgRemover" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </radialGradient>
    <linearGradient id="removerCan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="25%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="75%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="removerLabel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="35%" stop-color="#ef4444"/>
      <stop offset="70%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <filter id="shadowRemover" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="600" height="600" rx="24" fill="url(#bgRemover)"/>

  <!-- Kaleng Paint Remover Polibest -->
  <g filter="url(#shadowRemover)" transform="translate(160, 90)">
    <!-- Badan Kaleng Silinder -->
    <rect x="40" y="60" width="200" height="360" rx="16" fill="url(#removerCan)"/>
    <!-- Tutup Kaleng Logam Atas -->
    <ellipse cx="140" cy="60" rx="100" ry="24" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
    <ellipse cx="140" cy="52" rx="55" ry="14" fill="#94a3b8" stroke="#475569" stroke-width="2"/>
    <circle cx="140" cy="52" r="16" fill="#e2e8f0"/>
    <!-- Dasar Kaleng Bawah -->
    <ellipse cx="140" cy="420" rx="100" ry="24" fill="#1e293b"/>

    <!-- Label Polibest Paint Remover -->
    <rect x="40" y="110" width="200" height="260" fill="url(#removerLabel)"/>
    <!-- Banner Putih Brand -->
    <rect x="40" y="135" width="200" height="50" fill="#ffffff"/>
    <text x="140" y="168" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="26" fill="#dc2626" text-anchor="middle" letter-spacing="2">POLIBEST</text>

    <!-- Judul Produk -->
    <text x="140" y="215" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="20" fill="#ffffff" text-anchor="middle" letter-spacing="1">PAINT REMOVER</text>
    <text x="140" y="235" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="13" fill="#fef08a" text-anchor="middle">PERONTOK CAT SPESIAL</text>

    <!-- Kotak Warning / Bahaya -->
    <rect x="80" y="255" width="120" height="70" rx="8" fill="#1e293b"/>
    <!-- Icon Api / Corrosive -->
    <polygon points="140,265 165,305 115,305" fill="#f59e0b"/>
    <text x="140" y="300" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="18" fill="#1e293b" text-anchor="middle">!</text>
    <text x="140" y="320" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="9" fill="#e2e8f0" text-anchor="middle">KERAS &amp; CEPAT MERONTOKKAN</text>

    <text x="140" y="355" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="12" fill="#ffffff" text-anchor="middle">NETTO: 1 KG / 1 LITER</text>
  </g>

  <!-- Tag Label -->
  <rect x="36" y="36" width="190" height="34" rx="8" fill="#0f172a" opacity="0.9"/>
  <text x="131" y="58" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="13" fill="#f87171" text-anchor="middle">PAINT REMOVER POLIBEST</text>
</svg>