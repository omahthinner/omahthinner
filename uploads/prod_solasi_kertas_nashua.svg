<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <radialGradient id="bgTape" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </radialGradient>
    <linearGradient id="crepeTape" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="40%" stop-color="#fde68a"/>
      <stop offset="70%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#fcd34d"/>
    </linearGradient>
    <filter id="shadowTape" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="600" height="600" rx="24" fill="url(#bgTape)"/>

  <!-- Stack Roll Solasi Kertas -->
  <g filter="url(#shadowTape)" transform="translate(100, 110)">
    <!-- Roll Bawah -->
    <g transform="translate(120, 200) rotate(12)">
      <ellipse cx="140" cy="140" rx="150" ry="85" fill="#fef08a" stroke="#d97706" stroke-width="2"/>
      <ellipse cx="140" cy="140" rx="80" ry="45" fill="#d97706"/>
      <ellipse cx="140" cy="140" rx="72" ry="40" fill="#f8fafc"/>
    </g>

    <!-- Roll Utama (Standing / Angled Front) -->
    <g transform="translate(30, 20)">
      <!-- Outer Roll Ring -->
      <circle cx="180" cy="180" r="170" fill="url(#crepeTape)" stroke="#b45309" stroke-width="3"/>
      <!-- Inner Core Coreboard -->
      <circle cx="180" cy="180" r="105" fill="#b45309"/>
      <circle cx="180" cy="180" r="95" fill="#ffffff"/>

      <!-- Nashua Branding di Inti Gulungan -->
      <circle cx="180" cy="180" r="90" fill="#1e293b"/>
      <text x="180" y="170" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="26" fill="#38bdf8" text-anchor="middle" letter-spacing="3">NASHUA</text>
      <text x="180" y="195" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="12" fill="#f59e0b" text-anchor="middle" letter-spacing="2">MASKING TAPE</text>
      <text x="180" y="215" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="10" fill="#94a3b8" text-anchor="middle">AUTOMOTIVE HEAT RESISTANT</text>

      <!-- Ujung Pita Lepas Masking -->
      <path d="M 330,240 Q 380,270 410,240 L 400,200 L 330,210 Z" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>
    </g>
  </g>

  <!-- Tag Label -->
  <rect x="36" y="36" width="180" height="34" rx="8" fill="#0f172a" opacity="0.9"/>
  <text x="126" y="58" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="13" fill="#fcd34d" text-anchor="middle">SOLASI KERTAS NASHUA</text>
</svg>