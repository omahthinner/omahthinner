<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <radialGradient id="bgFlin" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </radialGradient>
    <linearGradient id="blackCan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="25%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="75%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="shadowFlin" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="600" height="600" rx="24" fill="url(#bgFlin)"/>

  <!-- Kaleng Flinkote -->
  <g filter="url(#shadowFlin)" transform="translate(150, 90)">
    <rect x="40" y="60" width="220" height="350" rx="16" fill="url(#blackCan)"/>
    <ellipse cx="150" cy="60" rx="110" ry="26" fill="#475569" stroke="#334155" stroke-width="2"/>
    <ellipse cx="150" cy="52" rx="60" ry="15" fill="#cbd5e1"/>
    <ellipse cx="150" cy="410" rx="110" ry="26" fill="#020617"/>

    <!-- Label Polibest Flinkote -->
    <rect x="40" y="110" width="220" height="250" fill="#0f172a"/>
    <rect x="40" y="110" width="220" height="10" fill="#f59e0b"/>
    <rect x="40" y="350" width="220" height="10" fill="#f59e0b"/>

    <!-- Brand -->
    <text x="150" y="150" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="28" fill="#ef4444" text-anchor="middle" letter-spacing="2">POLIBEST</text>
    <text x="150" y="188" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="24" fill="#f59e0b" text-anchor="middle" letter-spacing="3">FLINKOTE</text>
    <text x="150" y="210" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="12" fill="#ffffff" text-anchor="middle" letter-spacing="1">UNDERCOATING ASPHALT</text>

    <!-- Ilustrasi Sasis / Mobil Tahan Karat -->
    <rect x="75" y="225" width="150" height="70" rx="8" fill="#1e293b"/>
    <path d="M 90,265 L 120,245 L 180,245 L 210,265 Z" fill="#475569"/>
    <circle cx="115" cy="270" r="10" fill="#64748b"/>
    <circle cx="185" cy="270" r="10" fill="#64748b"/>
    <text x="150" y="288" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="10" fill="#38bdf8" text-anchor="middle">ANTI KARAT KOLONG MOBIL</text>

    <text x="150" y="335" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="13" fill="#ffffff" text-anchor="middle">HITAM PEKAT • 1 KG</text>
  </g>

  <!-- Tag Label -->
  <rect x="36" y="36" width="170" height="34" rx="8" fill="#0f172a" opacity="0.9"/>
  <text x="121" y="58" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="13" fill="#f59e0b" text-anchor="middle">FLINKOTE POLIBEST</text>
</svg>