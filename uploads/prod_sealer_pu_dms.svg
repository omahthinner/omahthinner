<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <radialGradient id="bgSeal" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </radialGradient>
    <linearGradient id="puCartridge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="30%" stop-color="#334155"/>
      <stop offset="55%" stop-color="#64748b"/>
      <stop offset="80%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadowSeal" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="600" height="600" rx="24" fill="url(#bgSeal)"/>

  <!-- Selongsong Cartridge PU Sealer -->
  <g filter="url(#shadowSeal)" transform="translate(190, 70)">
    <!-- Corong Aplikator Putih (Nozzle) -->
    <polygon points="110,30 95,110 125,110" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="92" y="105" width="36" height="15" rx="3" fill="#e2e8f0"/>

    <!-- Badan Tabung Cartridge -->
    <rect x="50" y="120" width="120" height="340" rx="10" fill="url(#puCartridge)"/>
    <ellipse cx="110" cy="120" rx="60" ry="14" fill="#cbd5e1"/>
    <ellipse cx="110" cy="460" rx="60" ry="14" fill="#0f172a"/>

    <!-- Label Tabung -->
    <rect x="50" y="160" width="120" height="250" fill="#020617"/>
    <rect x="50" y="160" width="120" height="8" fill="#38bdf8"/>
    
    <text x="110" y="200" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="28" fill="#ffffff" text-anchor="middle" letter-spacing="3">DMS</text>
    <text x="110" y="225" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="16" fill="#38bdf8" text-anchor="middle" letter-spacing="1">PU SEALER</text>
    <text x="110" y="245" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="10" fill="#94a3b8" text-anchor="middle">POLYURETHANE</text>

    <!-- Informasi Penggunaan -->
    <rect x="62" y="260" width="96" height="75" rx="6" fill="#1e293b"/>
    <text x="110" y="280" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="11" fill="#facc15" text-anchor="middle">AUTO GLASS &amp;</text>
    <text x="110" y="296" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="11" fill="#facc15" text-anchor="middle">BODY SEAM</text>
    <text x="110" y="320" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="600" font-size="9" fill="#e2e8f0" text-anchor="middle">HIGH STRENGTH</text>

    <text x="110" y="375" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="11" fill="#ffffff" text-anchor="middle">310 ML / HITAM</text>
  </g>

  <!-- Tag Label -->
  <rect x="36" y="36" width="160" height="34" rx="8" fill="#0f172a" opacity="0.9"/>
  <text x="116" y="58" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="13" fill="#38bdf8" text-anchor="middle">SEALER PU DMS</text>
</svg>