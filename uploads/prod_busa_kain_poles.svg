<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <radialGradient id="bgPad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </radialGradient>
    <linearGradient id="orangeFoam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="shadowPad" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="600" height="600" rx="24" fill="url(#bgPad)"/>

  <!-- Kain Microfiber (Background Folded) -->
  <g filter="url(#shadowPad)" transform="translate(80, 220)">
    <path d="M 40,80 Q 90,40 220,60 Q 320,80 380,140 Q 280,240 180,220 Q 80,200 40,80 Z" fill="#38bdf8" stroke="#0284c7" stroke-width="2"/>
    <text x="210" y="150" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="14" fill="#ffffff" letter-spacing="2" text-anchor="middle">MICROFIBER DETAILING</text>
  </g>

  <!-- Busa Poles Waffle Foam Pad 5 Inch (Front) -->
  <g filter="url(#shadowPad)" transform="translate(190, 80)">
    <!-- Waffle Disc Circle -->
    <circle cx="150" cy="150" r="140" fill="url(#orangeFoam)" stroke="#c2410c" stroke-width="3"/>
    
    <!-- Waffle Dimple Texture -->
    <g fill="#ea580c" opacity="0.6">
      <circle cx="90" cy="90" r="14"/><circle cx="150" cy="90" r="14"/><circle cx="210" cy="90" r="14"/>
      <circle cx="90" cy="150" r="14"/><circle cx="150" cy="150" r="14"/><circle cx="210" cy="150" r="14"/>
      <circle cx="90" cy="210" r="14"/><circle cx="150" cy="210" r="14"/><circle cx="210" cy="210" r="14"/>
    </g>

    <!-- Center Arbor / Backing Plate Velcro -->
    <circle cx="150" cy="150" r="45" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
    <circle cx="150" cy="150" r="18" fill="#f8fafc"/>
    <text x="150" y="155" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="12" fill="#0f172a" text-anchor="middle">5"</text>
  </g>

  <!-- Tag Label -->
  <rect x="36" y="36" width="180" height="34" rx="8" fill="#0f172a" opacity="0.9"/>
  <text x="126" y="58" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="13" fill="#f97316" text-anchor="middle">BUSA &amp; KAIN POLES</text>
</svg>