<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <radialGradient id="bgSil" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </radialGradient>
    <linearGradient id="silTube" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="35%" stop-color="#f8fafc"/>
      <stop offset="70%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <filter id="shadowSil" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="600" height="600" rx="24" fill="url(#bgSil)"/>

  <!-- Cartridge Silicon DMS -->
  <g filter="url(#shadowSil)" transform="translate(190, 70)">
    <polygon points="110,30 95,110 125,110" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="92" y="105" width="36" height="15" rx="3" fill="#e2e8f0"/>

    <rect x="50" y="120" width="120" height="340" rx="10" fill="url(#silTube)"/>
    <ellipse cx="110" cy="120" rx="60" ry="14" fill="#f8fafc"/>
    <ellipse cx="110" cy="460" rx="60" ry="14" fill="#64748b"/>

    <!-- Label Silicon -->
    <rect x="50" y="160" width="120" height="250" fill="#0f172a"/>
    <rect x="50" y="160" width="120" height="8" fill="#10b981"/>
    
    <text x="110" y="200" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="28" fill="#ffffff" text-anchor="middle" letter-spacing="3">DMS</text>
    <text x="110" y="225" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="15" fill="#10b981" text-anchor="middle" letter-spacing="1">RTV SILICONE</text>
    <text x="110" y="245" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="10" fill="#94a3b8" text-anchor="middle">100% ACETIC SEALANT</text>

    <rect x="62" y="260" width="96" height="75" rx="6" fill="#1e293b"/>
    <text x="110" y="280" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="11" fill="#34d399" text-anchor="middle">KACA &amp; GASKET</text>
    <text x="110" y="296" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="10" fill="#ffffff" text-anchor="middle">TAHAN BOCOR</text>
    <text x="110" y="320" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="600" font-size="9" fill="#94a3b8" text-anchor="middle">ELASTIS &amp; KUAT</text>

    <text x="110" y="375" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="11" fill="#ffffff" text-anchor="middle">BENING / CLEAR</text>
  </g>

  <!-- Tag Label -->
  <rect x="36" y="36" width="180" height="34" rx="8" fill="#0f172a" opacity="0.9"/>
  <text x="126" y="58" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="13" fill="#10b981" text-anchor="middle">SEALER SILICON DMS</text>
</svg>