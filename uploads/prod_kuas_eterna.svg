<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <radialGradient id="bgLight" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </radialGradient>
    <linearGradient id="woodHandle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#854d0e"/>
      <stop offset="25%" stop-color="#b45309"/>
      <stop offset="60%" stop-color="#d97706"/>
      <stop offset="85%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="chromeFerrule" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="20%" stop-color="#cbd5e1"/>
      <stop offset="45%" stop-color="#f8fafc"/>
      <stop offset="75%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="whiteBristles" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="40%" stop-color="#f1f5f9"/>
      <stop offset="90%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="600" height="600" rx="24" fill="url(#bgLight)"/>

  <!-- Kuas Bayangan & Badan -->
  <g filter="url(#softShadow)" transform="translate(140, 50)">
    <!-- Bristles / Bulu Kuas -->
    <path d="M 60,60 L 260,60 Q 255,170 250,210 L 70,210 Q 65,170 60,60 Z" fill="url(#whiteBristles)"/>
    <!-- Tekstur Bulu Halus -->
    <line x1="80" y1="65" x2="85" y2="205" stroke="#94a3b8" stroke-width="1.2" opacity="0.6"/>
    <line x1="110" y1="62" x2="112" y2="208" stroke="#cbd5e1" stroke-width="1.5"/>
    <line x1="140" y1="60" x2="140" y2="210" stroke="#94a3b8" stroke-width="1.2" opacity="0.5"/>
    <line x1="170" y1="62" x2="168" y2="208" stroke="#cbd5e1" stroke-width="1.5"/>
    <line x1="200" y1="60" x2="198" y2="208" stroke="#94a3b8" stroke-width="1.2" opacity="0.6"/>
    <line x1="230" y1="65" x2="225" y2="205" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- Ferrule Logam Stainless -->
    <rect x="68" y="210" width="184" height="65" rx="4" fill="url(#chromeFerrule)"/>
    <!-- Paku Keling Ferrule -->
    <circle cx="95" cy="242" r="5" fill="#334155"/>
    <circle cx="160" cy="242" r="5" fill="#334155"/>
    <circle cx="225" cy="242" r="5" fill="#334155"/>
    <line x1="68" y1="225" x2="252" y2="225" stroke="#334155" stroke-width="1.5" opacity="0.7"/>

    <!-- Handle Kayu Eterna -->
    <path d="M 100,275 L 220,275 L 180,480 Q 160,520 160,520 Q 140,480 100,275 Z" fill="url(#woodHandle)"/>
    <!-- Lubang Gantungan Kuas -->
    <circle cx="160" cy="485" r="12" fill="#451a03"/>
    <circle cx="160" cy="485" r="9" fill="#1e293b"/>

    <!-- Cap Tulisan Eterna -->
    <g transform="translate(160, 370) rotate(-90)">
      <text x="0" y="0" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="20" fill="#fef08a" letter-spacing="4" text-anchor="middle">ETERNA</text>
      <text x="0" y="18" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="12" fill="#ffffff" letter-spacing="2" text-anchor="middle">633 • 2 INCH</text>
    </g>
  </g>

  <!-- Product Tag Badge -->
  <rect x="36" y="36" width="160" height="34" rx="8" fill="#0f172a" opacity="0.9"/>
  <text x="116" y="58" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="13" fill="#38bdf8" text-anchor="middle">KUAS CAT ETERNA</text>
</svg>