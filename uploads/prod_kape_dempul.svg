<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <radialGradient id="bgKape" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </radialGradient>
    <linearGradient id="steelBlade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="30%" stop-color="#f1f5f9"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="70%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="camelHandle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="40%" stop-color="#ef4444"/>
      <stop offset="80%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <filter id="shadowKape" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="15" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="600" height="600" rx="24" fill="url(#bgKape)"/>

  <!-- Kape Set 1 (Background Kape Kuning) -->
  <g filter="url(#shadowKape)" transform="translate(80, 100) rotate(-15 150 200)">
    <polygon points="40,280 200,280 180,100 60,100" fill="url(#steelBlade)"/>
    <rect x="50" y="270" width="140" height="150" rx="16" fill="#f59e0b"/>
    <circle cx="120" cy="390" r="10" fill="#78350f"/>
  </g>

  <!-- Kape Utama Camel (Center Front) -->
  <g filter="url(#shadowKape)" transform="translate(180, 80) rotate(8 150 200)">
    <!-- Mata Pisau Plat Baja Lentur -->
    <polygon points="20,290 260,290 230,70 50,70" fill="url(#steelBlade)"/>
    <!-- Garis bevel ketajaman -->
    <line x1="50" y1="70" x2="230" y2="70" stroke="#f8fafc" stroke-width="4"/>
    <line x1="20" y1="290" x2="260" y2="290" stroke="#475569" stroke-width="2"/>

    <!-- Logo & Text Laser Marking -->
    <g transform="translate(140, 170)">
      <rect x="-65" y="-25" width="130" height="50" rx="8" fill="#1e293b" opacity="0.12"/>
      <text x="0" y="5" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="24" fill="#1e293b" letter-spacing="3" text-anchor="middle">CAMEL</text>
      <text x="0" y="22" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="11" fill="#475569" letter-spacing="1" text-anchor="middle">FLEXIBLE PUTTY SCRAPER</text>
    </g>

    <!-- Handle Merah Ergonomis -->
    <path d="M 50,280 Q 40,320 60,430 Q 70,470 140,470 Q 210,470 220,430 Q 240,320 230,280 Z" fill="url(#camelHandle)"/>
    <!-- Rivet Kuningan -->
    <circle cx="100" cy="320" r="6" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5"/>
    <circle cx="180" cy="320" r="6" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5"/>
    <!-- Lubang Gantungan -->
    <circle cx="140" cy="440" r="10" fill="#7f1d1d"/>
  </g>

  <!-- Tag Label -->
  <rect x="36" y="36" width="170" height="34" rx="8" fill="#0f172a" opacity="0.9"/>
  <text x="121" y="58" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="13" fill="#f59e0b" text-anchor="middle">SKRAP DEMPUL SET</text>
</svg>