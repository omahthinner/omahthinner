<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="puttyBg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </radialGradient>
    <linearGradient id="puttyTub" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#991b1b"/>
      <stop offset="35%" stop-color="#dc2626"/>
      <stop offset="65%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <linearGradient id="lidGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="20" fill="url(#puttyBg)"/>
  <circle cx="200" cy="200" r="140" fill="#dc2626" opacity="0.12" filter="blur(30px)"/>

  <!-- Shadow -->
  <ellipse cx="200" cy="335" rx="110" ry="16" fill="#000000" opacity="0.5"/>

  <!-- Dempul Tub Body -->
  <!-- Rim / Lid -->
  <ellipse cx="200" cy="130" rx="105" ry="24" fill="url(#lidGold)" stroke="#fef08a" stroke-width="2"/>
  <ellipse cx="200" cy="126" rx="96" ry="20" fill="#1e293b"/>
  <!-- Tub Body -->
  <path d="M95 130 L115 310 Q200 330 285 310 L305 130 Z" fill="url(#puttyTub)" stroke="#fca5a5" stroke-width="1.5"/>
  <!-- Base Curve -->
  <ellipse cx="200" cy="310" rx="85" ry="16" fill="#991b1b"/>

  <!-- Label on Tub -->
  <rect x="130" y="175" width="140" height="105" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="136" y="181" width="128" height="93" rx="6" fill="#0f172a"/>
  
  <text x="200" y="206" font-family="'Outfit', sans-serif" font-weight="900" font-size="20" fill="#facc15" text-anchor="middle" letter-spacing="1.5">TANURI</text>
  <text x="200" y="224" font-family="'Outfit', sans-serif" font-weight="800" font-size="13" fill="#ffffff" text-anchor="middle" letter-spacing="1">POLYESTER PUTTY</text>
  <rect x="146" y="232" width="108" height="16" rx="8" fill="#dc2626"/>
  <text x="200" y="244" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="9.5" fill="#ffffff" text-anchor="middle">NO. #1 PUTTY INDONESIA</text>
  <text x="200" y="262" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="9" fill="#94a3b8" text-anchor="middle">DAYA REKAT TINGGI &bull; HALUS</text>
  
  <!-- Hardener small tube beside -->
  <rect x="290" y="240" width="18" height="65" rx="5" fill="#facc15" stroke="#ca8a04" stroke-width="1.5"/>
  <rect x="294" y="228" width="10" height="14" rx="2" fill="#e2e8f0"/>
</svg>
